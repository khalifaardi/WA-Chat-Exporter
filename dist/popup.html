<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>WA Exporter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:420px;min-height:540px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#1a1a1a;font-size:13px}

.header{padding:16px 18px 12px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:10px}
.header .dot{width:10px;height:10px;background:#0bbd00;border-radius:50%;flex-shrink:0}
.header h1{font-size:15px;font-weight:600}
.header p{font-size:11px;color:#888;margin-top:1px}

.panel{padding:16px 18px}
.section{margin-bottom:14px}
.section-title{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

input[type="date"],select,.input-like{width:100%;padding:8px 10px;background:#f9faf9;border:1px solid #e0e3e0;border-radius:8px;font-size:13px;color:#1a1a1a;outline:none;font-family:inherit;transition:border-color .2s}
input[type="date"]:focus,select:focus,.input-like:focus{border-color:#0bbd00}
input:disabled,select:disabled{opacity:.4;cursor:not-allowed;background:#f0f0f0}

.date-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.date-row .sep{color:#999;font-size:13px;padding-top:4px}
.date-col label{display:block;font-size:10px;color:#888;margin-bottom:3px}

.all-msg-row{display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer;font-size:12px}
.all-msg-row input[type="checkbox"]{accent-color:#0bbd00;width:14px;height:14px}

.format-radio-group{display:flex;flex-direction:column;gap:6px}
.format-radio{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;padding:8px 10px;background:#f9faf9;border:1px solid #e0e3e0;border-radius:8px;transition:border-color .2s}
.format-radio:has(input:checked){border-color:#0bbd00;background:#f6faf5}
.format-radio input[type="radio"]{accent-color:#0bbd00;width:14px;height:14px;flex-shrink:0}
.format-radio .radio-label{color:#1a1a1a}

/* Pills */
.pill-bar{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#e8f5e0;border:1px solid #c8e0c0;border-radius:14px;font-size:11px;color:#2e5a2e}
.pill .x{cursor:pointer;font-size:13px;font-weight:700;color:#4a8a4a;line-height:1}
.pill .x:hover{color:#c62828}
.pill-bar .more{font-size:10.5px;color:#888;padding:3px 4px}
.too-long{display:none;margin-top:6px;font-size:11px;color:#b9892a;text-align:center;padding:8px 10px;background:#fff8e8;border:1px solid #f0d890;border-radius:6px}
.too-long .msg{display:block;margin-bottom:6px}
.btn-reload{display:inline-block;padding:5px 14px;background:#f0a030;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:background .2s}
.btn-reload:hover{background:#e09020}
.btn-reload:disabled{opacity:.5;cursor:not-allowed}
.lang-row{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;flex-shrink:0}
.lang-row select{border:none;background:#f0f2f0;border-radius:4px;padding:2px 4px;font-size:10px;color:#555;cursor:pointer}

/* Custom Dropdown */
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f9faf9;border:1px solid #e0e3e0;border-radius:8px;cursor:pointer;min-height:38px;font-size:13px;transition:border-color .2s}
.dropdown-trigger.open{border-color:#0bbd00;border-radius:8px 8px 0 0}
.dropdown-trigger .arrow{font-size:10px;color:#999;transition:transform .2s}
.dropdown-trigger.open .arrow{transform:rotate(180deg)}
.dropdown-trigger .placeholder{color:#aaa}
.dropdown-trigger .count{background:#e8f5e0;color:#0bbd00;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}

.dropdown-menu{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #0bbd00;border-top:none;border-radius:0 0 8px 8px;z-index:10;max-height:300px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.dropdown-menu.open{display:block}
.dropdown-menu .search-wrap{padding:8px;border-bottom:1px solid #eee}
.dropdown-menu .search-wrap input{width:100%;padding:7px 9px 7px 28px;background:#f5f6f5;border:1px solid #e0e3e0;border-radius:6px;font-size:12px;outline:none}
.dropdown-menu .option-list{overflow-y:auto;max-height:240px}
.dropdown-menu .option{padding:7px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f5f5f5;transition:background .15s}
.dropdown-menu .option:hover{background:#f6faf5}
.dropdown-menu .option input[type="checkbox"]{accent-color:#0bbd00;width:14px;height:14px}
.dropdown-menu .option .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown-menu .option .badge{font-size:10px;padding:1px 5px;border-radius:3px;flex-shrink:0}
.dropdown-menu .option .badge.group{background:#e8f5e0;color:#2e7d32}
.dropdown-menu .option .badge.chat{background:#e8eaf0;color:#555}
.dropdown-menu .option.all-chats{font-weight:600;border-bottom:1px solid #e0e3e0}
.dropdown-menu .loading{padding:16px;text-align:center;color:#999;font-size:12px}

.btn{width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:#0bbd00;color:#fff}
.btn-primary:hover:not(:disabled){background:#0aa800;box-shadow:0 2px 8px rgba(11,189,0,.25)}
.btn-pause{background:#f0f4f8;color:#5a7aaa;border:1px solid #d0d8e0}
.btn-pause:hover{background:#e5ecf4}
.btn-danger{background:#faf0f0;color:#c62828;border:1px solid #f0d0d0}
.btn-danger:hover{background:#f5e0e0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-top:6px}

.lang-label{font-size:10px;color:#0bbd00;font-weight:600;padding:2px 8px;background:#e8f5e0;border-radius:4px;display:inline-block}

.login-prompt{text-align:center;padding:40px 20px}
.login-prompt .login-icon{font-size:40px;margin-bottom:12px}
.login-prompt .login-title{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.login-prompt .login-desc{font-size:11px;color:#888;margin-bottom:18px;line-height:1.5}
.login-prompt .btn{width:auto;display:inline-flex;padding:8px 20px}

#status{display:none;margin-top:10px;padding:10px 12px;background:#f5faf5;border:1px solid #d5e8d0;border-radius:8px;font-size:12px;color:#2e5a2e;line-height:1.5}
#status.error{background:#faf4f4;border-color:#e8d0d0;color:#8b2a2a}
#status.success{background:#f0faf0;border-color:#b8e0b8;color:#2e6b2e}

.progress-wrap{display:none;margin-top:10px}
.progress-bar-bg{background:#e8ece8;border-radius:5px;height:6px;overflow:hidden}
.progress-bar-fill{height:100%;background:#0bbd00;width:0;border-radius:5px;transition:width .3s}
.progress-info{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:4px}
</style></head><body>
<div class="header"><div class="dot"></div><div style="flex:1"><h1 id="extTitle">WA Chat Exporter</h1><p id="extDesc">Export chats as CSV or plain text</p></div><div class="lang-row"><span class="lang-label" id="langLabel">Bahasa Indonesia</span><select id="langSelect"><option value="id">ID</option><option value="en">EN</option></select></div></div>

<div class="panel">
  <div class="login-prompt" id="loginPrompt" style="display:none">
    <div class="login-icon">&#128274;</div>
    <div class="login-title" id="loginTitle">Please log in to WhatsApp Web first</div>
    <div class="login-desc" id="loginDesc">Open WhatsApp Web, scan the QR code with your phone, then come back.</div>
    <button class="btn btn-primary" id="btnOpenWA">Open WhatsApp Web</button>
    <button class="btn btn-pause" id="btnCheckAgain" style="margin-top:6px">Check Again</button>
  </div>
  <div id="mainUI">
  <div class="section">
    <div class="section-title">Choose File Format</div>
    <div class="format-radio-group">
      <label class="format-radio"><input type="radio" name="chatFormat" value="csv" checked><span class="radio-label" id="fmtCsvLabel">CSV (recommended for analysis)</span></label>
      <label class="format-radio"><input type="radio" name="chatFormat" value="txt"><span class="radio-label" id="fmtTxtLabel">Plain Text (readable format)</span></label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Select Chat</div>
    <div class="dropdown" id="chatDropdown">
      <div class="dropdown-trigger" id="dropdownTrigger">
        <span class="placeholder" id="dropdownLabel">Loading chats...</span>
        <span class="arrow">&#9660;</span>
      </div>
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="search-wrap"><input id="dropdownSearch" placeholder="Search chats..." style="padding-left:28px"></div>
        <div class="option-list" id="dropdownList">
          <div class="loading">Loading chats...</div>
        </div>
      </div>
    </div>
    <div class="pill-bar" id="pillBar"></div>
    <div class="too-long" id="tooLong"><span class="msg" id="tooLongMsg"></span><button class="btn-reload" id="btnReloadWA">Reload WhatsApp</button></div>
  </div>

  <div class="section">
    <div class="section-title">Choose Date</div>
    <div class="date-row">
      <div class="date-col"><label>Start</label><input type="date" id="dateFrom"></div>
      <span class="sep">—</span>
      <div class="date-col"><label>End</label><input type="date" id="dateTo"></div>
    </div>
    <div class="all-msg-row" id="allMsgRow">
      <input type="checkbox" id="allMessages">
      <span>Export all messages (ignore date range)</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btnExportChat">Export Chat</button>
  <button class="btn btn-pause" id="btnPause" style="display:none">Pause Export</button>
  <button class="btn btn-danger" id="btnCancel" style="display:none">Cancel</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
    <div class="progress-info"><span id="progressLeft"></span><span id="progressRight"></span></div>
  </div>
  <div id="status"></div>
  </div><!-- #mainUI -->
</div>

<script src="popup.js"></script>
</body></html>
